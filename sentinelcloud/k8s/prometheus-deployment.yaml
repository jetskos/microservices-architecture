apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sentinelcloud
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: auth-service
        static_configs:
          - targets: ['auth-service:8000']
        metrics_path: /metrics

      - job_name: reservation-service
        static_configs:
          - targets: ['reservation-service:8001']
        metrics_path: /metrics

      - job_name: resource-service
        static_configs:
          - targets: ['resource-service:8002']
        metrics_path: /metrics

  alerts.yml: |
    groups:
      - name: sentinelcloud-soc-alerts
        rules:
          # Détection surcharge trafic
          - alert: HighRequestRate
            expr: sum(rate(reservation_http_requests_total[2m])) + sum(rate(resource_http_requests_total[2m])) > 50
            for: 2m
            labels:
              severity: warning
              soc_tag: SECURITY
            annotations:
              summary: "Surcharge détectée"
              description: "Le débit de requêtes dépasse le seuil attendu."

          # Détection erreurs HTTP 5xx
          - alert: HighServerErrors
            expr: sum(rate(reservation_http_requests_total{status=~"5.."}[5m])) + sum(rate(resource_http_requests_total{status=~"5.."}[5m])) > 1
            for: 1m
            labels:
              severity: critical
              soc_tag: ERROR
            annotations:
              summary: "Pic d'erreurs 5xx"
              description: "Un taux élevé d'erreurs serveur a été détecté."

          # Détection latence élevée
          - alert: HighLatencyP95
            expr: histogram_quantile(0.95, sum(rate(reservation_http_request_latency_seconds_bucket[5m])) by (le)) > 1.5
            for: 5m
            labels:
              severity: warning
              soc_tag: ERROR
            annotations:
              summary: "Latence élevée p95"
              description: "La latence p95 du service réservation dépasse 1.5s."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sentinelcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sentinelcloud
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090

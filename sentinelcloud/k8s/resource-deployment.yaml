apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: sentinelcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
    spec:
      containers:
        - name: resource-service
          image: sentinelcloud/resource-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: KEYCLOAK_ISSUER
              value: http://keycloak:8080/realms/sentinelcloud
            - name: KEYCLOAK_JWKS_URL
              value: http://keycloak:8080/realms/sentinelcloud/protocol/openid-connect/certs
            - name: KEYCLOAK_AUDIENCE
              value: sentinelcloud-api
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8002
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: sentinelcloud
spec:
  selector:
    app: resource-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
